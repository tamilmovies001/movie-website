<!DOCTYPE html>
<html>
<head>
<title>Tamil Movies Hub</title>

<style>

body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
}

header{
background:red;
padding:20px;
font-size:30px;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.movie{
background:#222;
width:200px;
margin:15px;
padding:10px;
border-radius:10px;
}

.movie img{
width:100%;
border-radius:10px;
}

button{
background:red;
color:white;
border:none;
padding:10px;
margin-top:10px;
cursor:pointer;
}

button:hover{
background:darkred;
}

#loginBox{
margin-top:20px;
}

#uploadSection{
display:none;
margin-top:20px;
}

</style>
</head>

<body>

<header>
Tamil Movies Download
</header>

<!-- OWNER LOGIN -->
<div id="loginBox">
<input type="password" id="ownerPass" placeholder="Owner Password">
<button onclick="loginOwner()">Login</button>
</div>

<!-- UPLOAD BUTTON (OWNER ONLY) -->
<div id="uploadSection">
<h3>Upload Movie</h3>
<input type="file" id="videoUpload">
<button onclick="uploadMovie()">Upload</button>
</div>

<input type="text" id="search" placeholder="Search Movie..." onkeyup="searchMovie()">

<div class="container" id="movieList">

<div class="movie">
<img src="https://via.placeholder.com/200x300">
<h3>Leo</h3>
<button onclick="downloadMovie('movies/leo.mp4')">Download</button>
</div>

<div class="movie">
<img src="https://via.placeholder.com/200x300">
<h3>Jailer</h3>
<button onclick="downloadMovie('movies/jailer.mp4')">Download</button>
</div>

<div class="movie">
<img src="https://via.placeholder.com/200x300">
<h3>Vikram</h3>
<button onclick="downloadMovie('movies/vikram.mp4')">Download</button>
</div>

</div>

<script>

let ownerPassword = "admin123"; // change this password

function loginOwner(){

let input = document.getElementById("ownerPass").value;

if(input === ownerPassword){
document.getElementById("uploadSection").style.display="block";
alert("Owner login successful");
}else{
alert("Wrong password");
}

}

function uploadMovie(){

let file = document.getElementById("videoUpload").files[0];

if(!file){
alert("Select a video first");
return;
}

let movieList = document.getElementById("movieList");

let movieDiv = document.createElement("div");
movieDiv.className="movie";

movieDiv.innerHTML = `
<img src="https://via.placeholder.com/200x300">
<h3>${file.name}</h3>
<button onclick="downloadMovie('${URL.createObjectURL(file)}')">Download</button>
`;

movieList.appendChild(movieDiv);

}

function downloadMovie(link){
window.location.href = link;
}

function searchMovie(){

let input = document.getElementById("search").value.toLowerCase();
let movies = document.querySelectorAll(".movie");

movies.forEach(function(movie){

let title = movie.innerText.toLowerCase();

if(title.includes(input)){
movie.style.display="block";
}else{
movie.style.display="none";
}

});

}

</script>

</body>
</html>
