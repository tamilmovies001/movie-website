<!DOCTYPE html>
<html>
<head>
<title>Tamil Movies Hub</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

header{
background:red;
padding:20px;
font-size:30px;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.movie{
background:#222;
width:220px;
margin:15px;
padding:10px;
border-radius:10px;
}

.movie img{
width:100%;
border-radius:10px;
}

button{
background:red;
color:white;
border:none;
padding:10px;
margin:5px;
cursor:pointer;
}

button:hover{
background:darkred;
}

#loginBox{
margin-top:20px;
}

#uploadSection{
display:none;
margin-top:20px;
}

input{
padding:8px;
margin:5px;
}

</style>
</head>

<body>

<header>
Tamil Movies Hub
</header>

<!-- OWNER LOGIN -->
<div id="loginBox">
<input type="password" id="ownerPass" placeholder="Owner Password">
<button onclick="loginOwner()">Login</button>
</div>

<!-- OWNER MOVIE ADD SECTION -->
<div id="uploadSection">

<h3>Add Movie</h3>

<input type="text" id="movieTitle" placeholder="Movie Name"><br>

<input type="text" id="posterLink" placeholder="Poster Image URL"><br>

<input type="text" id="movieLink" placeholder="Movie Download / Watch Link"><br>

<button onclick="addMovie()">Add Movie</button>

</div>

<br>

<input type="text" id="search" placeholder="Search Movie..." onkeyup="searchMovie()">

<div class="container" id="movieList">

<!-- Example Movie -->

<div class="movie">

<img src="https://via.placeholder.com/200x300">

<h3>Sample Movie</h3>

<a href="https://drive.google.com" target="_blank">
<button>Watch</button>
</a>

<a href="https://drive.google.com" target="_blank">
<button>Download</button>
</a>

</div>

</div>

<script>

let ownerPassword="admin007";

function loginOwner(){

let pass=document.getElementById("ownerPass").value;

if(pass===ownerPassword){

document.getElementById("uploadSection").style.display="block";

alert("Owner Login Success");

}else{

alert("Wrong Password");

}

}

function addMovie(){

let title=document.getElementById("movieTitle").value;
let poster=document.getElementById("posterLink").value;
let link=document.getElementById("movieLink").value;

if(title=="" || poster=="" || link==""){
alert("Fill all fields");
return;
}

let movieList=document.getElementById("movieList");

let div=document.createElement("div");

div.className="movie";

div.innerHTML=`
<img src="${poster}">
<h3>${title}</h3>

<a href="${link}" target="_blank">
<button>Watch</button>
</a>

<a href="${link}" target="_blank">
<button>Download</button>
</a>
`;

movieList.appendChild(div);

}

function searchMovie(){

let input=document.getElementById("search").value.toLowerCase();

let movies=document.querySelectorAll(".movie");

movies.forEach(function(movie){

let title=movie.innerText.toLowerCase();

if(title.includes(input)){
movie.style.display="block";
}else{
movie.style.display="none";
}

});

}

</script>

</body>
</html>
